[package]
name = "agent-cli-contract"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Test stable machine contracts for CLIs used by agents and scripts"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-agent-cli-contract"
readme = "README.md"
keywords = ["cli", "testing", "snapshot", "agents"]
categories = ["command-line-utilities", "development-tools::testing"]
include = ["/src/**", "/examples/**", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[[bin]]
name = "agent-contract"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
portable-pty = "0.9"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tempfile = "3.20"
wait-timeout = "0.2"
