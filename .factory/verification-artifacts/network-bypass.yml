version: 1
command:
  - /usr/bin/node
  - -e
  - "fetch('https://example.com').then(r => { console.log('status=' + r.status); process.exit(r.ok ? 0 : 3) }).catch(e => { console.error(e.message); process.exit(4) })"
fixtures:
  - name: undeclared network from ordinary runtime
    expect:
      exit: 0
      stdout_contains: ["status=200"]
    timeout_ms: 10000
    allow_network: false
